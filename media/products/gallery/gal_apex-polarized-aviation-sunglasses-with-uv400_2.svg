<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5b21b6;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#grad)" />
  <circle cx="400" cy="380" r="260" fill="url(#glow)" />
  
  <!-- Sleek Product Podium Card -->
  <rect x="150" y="140" width="500" height="480" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Category Badge -->
  <rect x="300" y="170" width="200" height="34" rx="17" fill="#5b21b6" fill-opacity="0.2" stroke="#5b21b6" stroke-width="1.5" />
  <text x="400" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">ACCESSORIES</text>

  <!-- Product Icon Shape Mockup -->
  <g transform="translate(400, 340)">
    <circle r="75" fill="#5b21b6" fill-opacity="0.15" stroke="#5b21b6" stroke-width="2" />
    <path d="M-30,-20 L30,-20 L20,30 L-20,30 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <circle cx="0" cy="5" r="8" fill="#5b21b6" />
  </g>

  <!-- Product Title & Tagline -->
  <text x="400" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Apex Polarized Aviation S - Angle 2</text>
  <text x="400" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Detailed Specification Showcase</text>

  <!-- ShopSphere Watermark -->
  <text x="400" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="3">SHOPSPHERE PREMIUM</text>
</svg>